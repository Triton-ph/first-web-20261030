<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>我的網站</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: #f1f5f9; color: #0f172a; min-height: 100vh; margin: 0; -webkit-font-smoothing: antialiased; }
    .hidden { display: none !important; }
    .pub-toggle-btn { position: fixed; top: 16px; left: 16px; z-index: 40; background: rgba(255,255,255,0.95); color: #1e293b; border: 1px solid rgba(226,232,240,0.9); padding: 8px 14px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); backdrop-filter: blur(8px); display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: transform 0.15s ease, color 0.15s ease; }
    .pub-toggle-btn:hover { color: #0284c7; transform: scale(1.04); }
    .pub-toggle-btn:active { transform: scale(0.96); }
    .pub-pulse-dot { width: 8px; height: 8px; border-radius: 999px; background: #0ea5e9; }
    .pub-layout { min-height: 100vh; display: flex; position: relative; }
    .pub-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 50; width: 256px; background: #ffffff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .pub-sidebar-hdr { padding: 14px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; background: #f8fafc; font-size: 12px; font-weight: 700; color: #1e293b; }
    .pub-close-btn { padding: 4px 8px; border: none; background: transparent; color: #64748b; border-radius: 6px; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px; }
    .pub-close-btn:hover { background: #e2e8f0; color: #0f172a; }
    .pub-tree { padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
    .pub-tree-sub { padding-left: 20px; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
    .pub-tree-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: #475569; transition: background 0.15s, color 0.15s; border: 1px solid transparent; }
    .pub-tree-item:hover { background: #f1f5f9; color: #0f172a; }
    .pub-tree-item.active { background: #f0f9ff; color: #0369a1; font-weight: 600; border-color: #bae6fd; }
    .pub-tree-item.child { font-size: 11px; position: relative; }
    .pub-tree-item.child::before { content: ''; position: absolute; left: -14px; top: 0; bottom: 50%; width: 12px; border-left: 2px solid #cbd5e1; border-bottom: 2px solid #cbd5e1; border-bottom-left-radius: 6px; }
    .pub-main { flex: 1; overflow: auto; padding: 16px 32px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    .pub-artboard { width: 1200px; min-height: 860px; position: relative; background-size: cover; background-position: center; background-repeat: no-repeat; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border: 1px solid rgba(203,213,225,0.8); overflow: hidden; }
    .pub-elements { position: absolute; inset: 0; }
    .pub-loading { position: fixed; top: 16px; right: 16px; z-index: 45; background: rgba(15,23,42,0.85); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 11px; }
  </style>
</head>
<body>
  <button id="pub-btn-toggle" class="pub-toggle-btn" title="點選展開目錄瀏覽所有頁面">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
    <span>網站目錄</span>
    <span class="pub-pulse-dot"></span>
  </button>

  <div id="pub-loading" class="pub-loading hidden">載入頁面中...</div>

  <div class="pub-layout">
    <aside id="pub-sidebar" class="pub-sidebar hidden">
      <div class="pub-sidebar-hdr">
        <span style="display:flex;align-items:center;gap:6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M6.5 10v7.5H14"/></svg>
          目錄
        </span>
        <button id="pub-btn-close" class="pub-close-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          收合
        </button>
      </div>
      <div id="pub-tree-container" class="pub-tree"></div>
    </aside>

    <main class="pub-main">
      <div id="pub-artboard" class="pub-artboard">
        <div id="pub-elements-container" class="pub-elements"></div>
      </div>
    </main>
  </div>

  <script>
    let MANIFEST = null;
    let curPageId = '';
    const PAGE_CACHE = new Map();

    const ICON_FOLDER = '<svg width="12" height="12" viewBox="0 0 24 24" fill="#f59e0b"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
    const ICON_FILE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

    function buildPubGrad(g) {
      if (!g) return '';
      const c1 = g.color1 || '#0284c7';
      const c2 = g.color2 || '#0f172a';
      const dir = g.direction || 'to right';
      if (dir === 'radial-out') return 'radial-gradient(circle at center, ' + c1 + ' 0%, ' + c2 + ' 100%)';
      if (dir === 'radial-in') return 'radial-gradient(circle at center, ' + c2 + ' 0%, ' + c1 + ' 100%)';
      if (dir === 'custom') return 'linear-gradient(' + (g.angle || 90) + 'deg, ' + c1 + ', ' + c2 + ')';
      return 'linear-gradient(' + dir + ', ' + c1 + ', ' + c2 + ')';
    }

    function renderPubTree() {
      const c = document.getElementById('pub-tree-container');
      c.innerHTML = '';
      if (!MANIFEST || !MANIFEST.pages) return;
      const roots = MANIFEST.pages.filter(p => !p.parentId);
      roots.forEach(root => {
        const kids = MANIFEST.pages.filter(p => p.parentId === root.id);
        c.appendChild(createPubTreeItem(root, false, kids.length > 0));
        if (kids.length > 0) {
          const sub = document.createElement('div');
          sub.className = 'pub-tree-sub';
          kids.forEach(k => sub.appendChild(createPubTreeItem(k, true, false)));
          c.appendChild(sub);
        }
      });
    }

    function createPubTreeItem(page, isChild, hasChildren) {
      const item = document.createElement('div');
      item.className = 'pub-tree-item' + (page.id === curPageId ? ' active' : '') + (isChild ? ' child' : '');
      item.innerHTML = (hasChildren ? ICON_FOLDER : ICON_FILE) + '<span></span>';
      item.querySelector('span').textContent = page.name;
      item.onclick = () => navigateToPage(page.id);
      return item;
    }

    async function loadPageData(pageId) {
      if (PAGE_CACHE.has(pageId)) return PAGE_CACHE.get(pageId);
      const loading = document.getElementById('pub-loading');
      if (loading) loading.classList.remove('hidden');
      try {
        const res = await fetch('./data/pages/' + encodeURIComponent(pageId) + '.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        PAGE_CACHE.set(pageId, data);
        return data;
      } finally {
        if (loading) loading.classList.add('hidden');
      }
    }

    async function navigateToPage(pageId, updateHash = true) {
      if (!MANIFEST || !MANIFEST.pages.length) return;
      const exists = MANIFEST.pages.some(p => p.id === pageId);
      const targetId = exists ? pageId : (MANIFEST.defaultPageId || MANIFEST.pages[0].id);
      curPageId = targetId;
      if (updateHash && location.hash !== '#' + targetId) {
        location.hash = '#' + targetId;
      }
      renderPubTree();
      const page = await loadPageData(targetId);
      renderPubPage(page);
    }

    function renderPubPage(page) {
      if (!page) return;
      const artboard = document.getElementById('pub-artboard');
      const container = document.getElementById('pub-elements-container');
      container.innerHTML = '';

      if (page.bgType === 'gradient' || (page.bgGradient && page.bgGradient.enabled)) {
        artboard.style.backgroundColor = 'transparent';
        artboard.style.backgroundImage = buildPubGrad(page.bgGradient);
        artboard.style.backgroundSize = 'cover';
        artboard.style.backgroundRepeat = 'no-repeat';
      } else if (page.bgType === 'image' || page.bgImage) {
        artboard.style.backgroundColor = page.bgColor || '#ffffff';
        artboard.style.backgroundImage = 'url("' + page.bgImage + '")';
        artboard.style.backgroundSize = page.bgSize || 'cover';
        artboard.style.backgroundRepeat = page.bgRepeat || 'no-repeat';
      } else {
        artboard.style.backgroundColor = page.bgColor || '#ffffff';
        artboard.style.backgroundImage = 'none';
      }

      let maxY = 860;
      (page.elements || []).forEach(el => {
        const bottom = (el.y || 0) + (el.h || 0) + 100;
        if (bottom > maxY) maxY = bottom;

        const d = document.createElement('div');
        d.style.position = 'absolute';
        d.style.left = el.x + 'px';
        d.style.top = el.y + 'px';
        d.style.width = el.w + 'px';
        d.style.height = el.h + 'px';
        d.style.zIndex = el.zIndex || 1;
        d.style.borderRadius = (el.borderRadius || 0) + 'px';
        d.style.opacity = (el.opacity ?? 100) / 100;
        d.style.boxShadow = el.shadow || 'none';
        d.style.backgroundColor = el.bgColor || 'transparent';
        d.style.overflow = 'hidden';

        if (el.type === 'text') {
          const t = document.createElement('div');
          t.style.width = '100%';
          t.style.height = '100%';
          t.style.fontFamily = el.fontFamily || "'Inter', sans-serif";
          t.style.fontSize = (el.fontSize || 16) + 'px';
          t.style.fontWeight = el.fontWeight || '400';
          t.style.color = el.color || '#1e293b';
          t.style.textAlign = el.align || 'left';
          t.style.lineHeight = el.lineHeight || '1.5';
          t.style.letterSpacing = el.letterSpacing || 'normal';
          t.style.whiteSpace = 'pre-wrap';
          t.style.padding = '4px 6px';
          t.textContent = el.content || '';
          d.appendChild(t);
        } else if (el.type === 'image') {
          const img = document.createElement('img');
          img.src = el.src || '';
          img.alt = el.alt || '';
          img.loading = 'lazy';
          img.decoding = 'async';
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = el.fit || 'contain';
          img.style.borderRadius = (el.borderRadius || 0) + 'px';
          if (el.linkUrl) {
            const a = document.createElement('a');
            a.href = el.linkUrl;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.style.display = 'block';
            a.style.width = '100%';
            a.style.height = '100%';
            a.appendChild(img);
            d.appendChild(a);
          } else {
            d.appendChild(img);
          }
        } else if (el.type === 'link') {
          const a = document.createElement('a');
          if (el.linkUrl && el.linkUrl.startsWith('#page-')) {
            const targetId = el.linkUrl.slice(1);
            a.href = '#' + targetId;
            a.onclick = (e) => { e.preventDefault(); navigateToPage(targetId); };
          } else {
            a.href = el.linkUrl || '#';
            if (el.targetBlank) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
          }
          a.style.width = '100%';
          a.style.height = '100%';
          a.style.display = 'flex';
          a.style.alignItems = 'center';
          a.style.justifyContent = 'center';
          a.style.overflow = 'hidden';
          a.style.textDecoration = 'none';

          const mode = el.linkMode || (el.linkImage ? 'image' : (el.bgColor === 'transparent' ? 'text' : 'button'));
          if (mode === 'image' && el.linkImage) {
            const img = document.createElement('img');
            img.src = el.linkImage;
            img.alt = el.linkText || '連結圖片';
            img.loading = 'lazy';
            img.decoding = 'async';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = el.imageFit || 'contain';
            img.style.borderRadius = (el.borderRadius || 0) + 'px';
            a.style.backgroundColor = 'transparent';
            a.appendChild(img);
          } else if (mode === 'text') {
            a.style.fontFamily = el.fontFamily || "'Inter', sans-serif";
            a.style.fontSize = (el.fontSize || 15) + 'px';
            a.style.fontWeight = el.fontWeight || '600';
            a.style.color = el.color || '#0284c7';
            a.style.backgroundColor = 'transparent';
            a.style.textDecoration = 'underline';
            a.style.textUnderlineOffset = '4px';
            a.textContent = el.linkText || '';
          } else {
            a.style.fontFamily = el.fontFamily || "'Inter', sans-serif";
            a.style.fontSize = (el.fontSize || 15) + 'px';
            a.style.fontWeight = el.fontWeight || '600';
            a.style.color = el.color || '#ffffff';
            a.style.backgroundColor = el.bgColor || '#0284c7';
            a.style.borderRadius = (el.borderRadius || 8) + 'px';
            a.textContent = el.linkText || '';
          }
          d.appendChild(a);
        } else if (el.type === 'html') {
          d.innerHTML = el.htmlCode || '';
        }
        container.appendChild(d);
      });
      artboard.style.height = maxY + 'px';
    }

    const pubSidebar = document.getElementById('pub-sidebar');
    const pubToggleBtn = document.getElementById('pub-btn-toggle');
    const pubCloseBtn = document.getElementById('pub-btn-close');
    if (pubToggleBtn) {
      pubToggleBtn.onclick = () => {
        pubSidebar.classList.toggle('hidden');
        pubToggleBtn.classList.toggle('hidden', !pubSidebar.classList.contains('hidden'));
      };
    }
    if (pubCloseBtn) {
      pubCloseBtn.onclick = () => {
        pubSidebar.classList.add('hidden');
        if (pubToggleBtn) pubToggleBtn.classList.remove('hidden');
      };
    }

    window.addEventListener('hashchange', () => {
      const hashId = location.hash ? location.hash.slice(1) : '';
      if (hashId && hashId !== curPageId) navigateToPage(hashId, false);
    });

    (async function initSite() {
      const res = await fetch('./data/manifest.json');
      MANIFEST = await res.json();
      const initialId = (location.hash && location.hash.slice(1)) || MANIFEST.defaultPageId || MANIFEST.pages[0].id;
      await navigateToPage(initialId, false);
    })();
  </script>
</body>
</html>
